server.port=8083
spring.application.name=API-GATEWAY

spring.cloud.gateway.server.webflux.routes[0].id=QUIZ-SERVICE
spring.cloud.gateway.server.webflux.routes[0].uri=lb://QUIZ-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/quiz/**

spring.cloud.gateway.server.webflux.routes[1].id=QUESTION-SERVICE
spring.cloud.gateway.server.webflux.routes[1].uri=lb://QUESTION-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/question/**

spring.cloud.gateway.server.webflux.routes[2].id=USER-SERVICE
spring.cloud.gateway.server.webflux.routes[2].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/user/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=RewritePath=/user/(?<segment>.*), /${segment}


eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# JWT - must be the SAME value as in UserService's application.properties
jwt.secretKey=dh3jrh3ruweijfwerq8rq0e9uqwjwqicqehyr893rnc89urc3nu39ecn39cunw

# Paths (as seen by the Gateway, i.e. WITH the /user, /quiz, /question prefix)
# that are allowed through without a valid JWT
app.public-routes=/user/auth/login,/user/auth/signup